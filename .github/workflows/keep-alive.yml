name: Keep ChainSight Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ChainSight API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 https://chainsight-api.onrender.com/ping)
          echo "Ping status: $STATUS at $(date)"
          if [ "$STATUS" != "200" ]; then
            echo "API returned non-200, waiting 90s for cold start..."
            sleep 90
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 https://chainsight-api.onrender.com/ping)
            echo "Retry status: $STATUS2 at $(date)"
          fi

      - name: Ping Telegram Bot
        run: |
          curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 https://crypto-insight-bot.onrender.com/ || true
          echo "Bot pinged at $(date)"

      - name: Ping MCP Server
        run: |
          curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 https://chainsight-mcp.onrender.com/mcp || true
          echo "MCP pinged at $(date)"
