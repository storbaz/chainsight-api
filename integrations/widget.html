<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChainSight Widget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0a0a1a; color: white; padding: 20px; }
    .widget { max-width: 400px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 18px; }
    .header p { font-size: 12px; color: #888; }
    .fear-greed { background: #1a1a3e; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .fear-greed .value { font-size: 48px; font-weight: 700; }
    .fear-greed .label { font-size: 14px; color: #888; }
    .coins { display: grid; gap: 10px; }
    .coin { background: #1a1a3e; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
    .coin-info { display: flex; align-items: center; gap: 10px; }
    .coin-symbol { font-weight: 700; font-size: 14px; }
    .coin-name { font-size: 12px; color: #888; }
    .coin-price { text-align: right; }
    .coin-value { font-weight: 700; }
    .coin-change { font-size: 12px; }
    .up { color: #00d4aa; }
    .down { color: #ff4757; }
    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #666; }
    .footer a { color: #00d4aa; text-decoration: none; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <h2>🔍 ChainSight</h2>
      <p>Real-time crypto data</p>
    </div>

    <div class="fear-greed" id="fear-greed">
      <div class="value">--</div>
      <div class="label">Loading...</div>
    </div>

    <div class="coins" id="coins"></div>

    <div class="footer">
      Powered by <a href="https://rapidapi.com/storbaz/api/chainsight" target="_blank">ChainSight API</a>
    </div>
  </div>

  <script>
    const API = "https://chainsight-api.onrender.com";

    async function load() {
      try {
        const [topRes, fgRes] = await Promise.all([
          fetch(`${API}/v1/market/top?limit=5`),
          fetch(`${API}/v1/market/fear-greed`)
        ]);
        const top = await topRes.json();
        const fg = await fgRes.json();

        const fgEl = document.getElementById("fear-greed");
        fgEl.innerHTML = `
          <div class="value">${fg.value}</div>
          <div class="label">${fg.classification}</div>`;

        const coinsEl = document.getElementById("coins");
        coinsEl.innerHTML = top.map(coin => {
          const change = coin.price_change_percentage_24h || 0;
          const cls = change >= 0 ? "up" : "down";
          const sign = change >= 0 ? "+" : "";
          return `
            <div class="coin">
              <div class="coin-info">
                <span class="coin-symbol">${coin.symbol.toUpperCase()}</span>
                <span class="coin-name">${coin.name}</span>
              </div>
              <div class="coin-price">
                <div class="coin-value">$${coin.current_price.toLocaleString()}</div>
                <div class="coin-change ${cls}">${sign}${change.toFixed(1)}%</div>
              </div>
            </div>`;
        }).join("");
      } catch (e) {
        console.error("Error loading data");
      }
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
